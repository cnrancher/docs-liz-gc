site:
  title: 'Rancher & Kubernetes AI'
  start_page: latest@rancher-ai-gc:zh:introduction.adoc

content:
  sources:
    - url: ./
      branches: [HEAD]
      start_paths: [shared, docs/latest]

ui:
  bundle:
    # url: ./dsc-style-bundle/default-ui/ui-bundle.zip
    url: https://raw.githubusercontent.com/cnrancher/dsc-style-bundle/main/default-ui/ui-bundle.zip
    snapshot: true
  supplemental_files: ./dsc-style-bundle/supplemental-files/rancher

asciidoc:
  attributes:
    page-draft-preview-only: 'You can have anything here, just not empty - so this is true, if empty string, or absent, then - false'
    page-pagination: ""
    tabs-sync-option: ""
  extensions:
    - "@asciidoctor/tabs"

antora:
  extensions:
    - require: "@antora/lunr-extension"
      languages: [zh]
      index_latest_only: true
    - require: "@sntke/antora-mermaid-extension"
      mermaid_library_url: https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs # <2>
      script_stem: header-scripts # <3>
      mermaid_initialize_options: # <4>
    - require: ./product-docs-common/extensions/dynamic-loading-attributes/load-global-site-attributes.js
      attributefile: ./product-gc-docs/global-attributes.yml
      enabled: true
    - require: ./product-docs-common/extensions/versions-latest-prerelease/vlp.js
      enabled: true

output:
  dir: build-local/site
